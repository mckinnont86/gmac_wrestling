# "Add video" / "Add event" forms (Issues -> New issue) update the FILM list in
# index.html. Only the repo owner's forms are applied. Whenever the site changes,
# the forms' "where" dropdowns are rebuilt so new events show up in them.
name: Film forms

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths: [index.html, scripts/film.mjs]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: film-list
  cancel-in-progress: false

jobs:
  apply-form:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'add-video') ||
       contains(github.event.issue.labels.*.name, 'add-event'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply the form to the film list
        id: apply
        continue-on-error: true
        run: node scripts/film.mjs apply "$GITHUB_EVENT_PATH"

      - name: Rebuild form dropdowns
        if: steps.apply.outcome == 'success'
        run: node scripts/film.mjs sync-forms

      - name: Commit and push
        id: push
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/ISSUE_TEMPLATE
          git commit -m "Film form #$ISSUE: $(head -1 .film-result.md | sed 's/^✅ //' | cut -c1-120)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && node scripts/film.mjs check || exit 1
          done
          exit 1

      - name: Publish the site
        if: steps.push.outcome == 'success'
        continue-on-error: true
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

      - name: Reply and close
        if: always()
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            gh issue comment "$ISSUE" --body-file .film-result.md
            gh issue close "$ISSUE" --reason completed
          else
            [ -f .film-result.md ] || echo "❌ Something went wrong saving the change. Open the Actions tab for details." > .film-result.md
            if [ "${{ steps.apply.outcome }}" = "success" ]; then
              echo "❌ The change was made but could not be saved (push failed). Submit the form again in a minute." > .film-result.md
            fi
            gh issue comment "$ISSUE" --body-file .film-result.md
          fi

  sync-forms:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check the film list
        run: node scripts/film.mjs check
      - name: Rebuild form dropdowns
        run: |
          node scripts/film.mjs sync-forms
          if [ -n "$(git status --porcelain .github/ISSUE_TEMPLATE)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add .github/ISSUE_TEMPLATE
            git commit -m "Update Add video / Add event form lists"
            git push || (git pull --rebase && git push)
          fi
